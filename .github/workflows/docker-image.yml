name: Docker Image CI

on:
  push:
    branches: [main]
    paths:
      - "Tutorial 6/randomquotes/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Construir imagen
        working-directory: Tutorial 6/randomquotes
        run: docker build -t leidyrodan/randomquotes:latest .

      - name: Publicar imagen
        run: docker push leidyrodan/randomquotes:latest